name: Build Terminal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'm_posw_entradas/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> $GITHUB_PATH

      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # Los paquetes ui.entradas/ y ui.pos/ no pueden importarse entre sí.
      - name: Enforce package separation
        working-directory: m_posw_entradas
        run: |
          ! grep -rn 'ui\.entradas' app/src/main/java/com/mposw/entradas/ui/pos/ \
          && ! grep -rn 'ui\.pos' app/src/main/java/com/mposw/entradas/ui/entradas/

      # Release sin firmar: verifica minify + shrink + split por ABI y deja
      # constancia del tamaño (medir siempre release, nunca debug).
      - name: Build release APKs (unsigned, per ABI)
        working-directory: m_posw_entradas
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Report release sizes
        working-directory: m_posw_entradas
        run: ls -la app/build/outputs/apk/release/

      # Debug universal instalable para la flota (probar ambos modos antes
      # de cada release: un bug en uno se distribuye con el otro).
      - name: Build debug APK
        working-directory: m_posw_entradas
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp m_posw_entradas/app/build/outputs/apk/debug/app-debug.apk mposw-terminal.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: terminal-latest
          name: Terminal (latest)
          body: APK debug universal generado automáticamente con cada push a main que toca m_posw_entradas/. Probar ambos modos (entradas y POS) antes de distribuir a la flota; actualizar primero una terminal de prueba.
          files: mposw-terminal.apk
