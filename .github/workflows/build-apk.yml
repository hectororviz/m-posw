name: Build Entradas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'm_posw_entradas/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> $GITHUB_PATH

      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: m_posw_entradas
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp m_posw_entradas/app/build/outputs/apk/debug/app-debug.apk mposw-entradas.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: entradas-latest
          name: Entradas POS (latest)
          body: APK debug generado automáticamente con cada push a main que toca m_posw_entradas/.
          files: mposw-entradas.apk
